# =====================================================================================
# [DISABLED AUTOMATIC DEPLOYMENT]
# Automatic deployment via GitHub Actions has been disabled because we switched to
# direct Cloudflare Pages CI integration (from the Cloudflare Dashboard).
# This file is kept for future reference or temporary testing purposes.
# =====================================================================================

name: Deploy to Cloudflare Pages

on:
  # Disabled to prevent double deployments
  # push:
  #   branches:
  #     - main
  workflow_dispatch: # Allows manual trigger from GitHub UI if needed

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build OpenNext
        working-directory: ./frontend
        env:
          NODE_ENV: 'production'
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://test-back-aura.ymzerotwo.com/api' }}
          NEXT_PRIVATE_MINIMAL_MODE: '1'
        run: |
          npx opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion
          node scripts/cf-setup.js

      - name: Deploy to Cloudflare Pages
        working-directory: ./frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 pages deploy .open-next --project-name auradash --branch main
